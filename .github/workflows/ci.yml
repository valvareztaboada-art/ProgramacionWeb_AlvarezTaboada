# Integración continua (CI): se ejecuta en cada pull request y en cada push a main.
# Si algún paso falla, el pipeline se corta y GitHub marca el PR con una ❌.
# Con la protección de la rama main (Settings → Rules) no se puede mergear hasta que pase.
#
# Despliegue continuo (CD): lo hace Vercel, conectado al repositorio.
#   · cada PR → un deploy de prueba (Preview) con su propia URL
#   · cada merge a main → producción
# Vercel tiene las variables de entorno cifradas: este workflow no necesita ninguna clave.
#
# Eventos (on) → jobs (corren en una máquina virtual limpia) → steps (en orden)

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo permiso necesario: solo leer el código
permissions:
  contents: read

# Si llega un push nuevo al mismo PR, se cancela la corrida anterior (ahorra minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci: instalación limpia y reproducible, exactamente lo del package-lock.json
      - name: Instalar dependencias
        run: npm ci

      # Validación de seguridad: falla si alguna dependencia de producción
      # tiene una vulnerabilidad conocida de gravedad alta o crítica
      - name: Revisar dependencias (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Revisar el código (lint)
        run: npm run lint

      - name: Correr los tests
        run: npm test

      - name: Compilar el proyecto (build)
        run: npm run build

  # Pruebas de extremo a extremo (E2E) con Playwright: abren el sitio en un navegador real
  # (compu y celular) y lo usan como una persona: clics, teclado, formularios, redirecciones.
  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El sitio necesita las dos claves PÚBLICAS de Supabase (las mismas que ve el navegador)
      # para que el proxy pida ingresar en las páginas privadas. Se les quitan espacios
      # o saltos de línea que pudieran haber quedado al pegarlas en los secrets.
      - name: Preparar las variables públicas de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          echo "NEXT_PUBLIC_SUPABASE_URL=${URL%/}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Instalar el navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Compilar el proyecto (build)
        run: npm run build

      # Con CI=true, Playwright levanta la versión de producción (next start)
      - name: Correr las pruebas E2E
        run: npm run test:e2e

      # Si algo falla, el reporte (con capturas y la traza para el Trace Viewer) queda para descargar
      - name: Guardar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
