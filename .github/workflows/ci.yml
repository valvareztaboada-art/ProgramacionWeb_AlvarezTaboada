# Integración continua (CI): se ejecuta en cada pull request y en cada push a main.
# Si algún paso falla, GitHub marca el PR con una ❌ y no conviene hacer merge.
# El deploy (CD) lo hace Vercel: preview por cada PR y producción al mergear a main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (lint)
        run: npm run lint

      - name: Correr los tests
        run: npm test

      - name: Compilar el proyecto (build)
        run: npm run build
