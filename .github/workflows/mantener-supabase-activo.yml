# Mantiene activo el proyecto gratuito de Supabase.
# Supabase pausa los proyectos gratis que pasan 7 días sin "suficiente actividad".
# Una lectura chiquita no alcanzó (igual llegó el aviso de pausa), así que el workflow
# ESCRIBE en la base: llama a la función registrar_latido(), que actualiza la fecha de la
# única fila de la tabla "latido" (ver supabase/migrations/..._latido.sql).
#
# Corre dos veces por día. Además, cron-job.org llama a https://mican-five.vercel.app/api/v1/salud
# (que también registra el latido): son dos fuentes independientes, por si GitHub atrasa
# o saltea alguna ejecución programada.
#
# Necesita dos "secrets" en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              → la misma URL que NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY  → la misma clave que NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY

name: Mantener Supabase activo

on:
  schedule:
    # 9:00 y 21:00 UTC (6:00 y 18:00 en Argentina). Formato cron: minuto hora día mes día-de-semana
    - cron: '0 9,21 * * *'
  # Permite correrlo a mano desde la pestaña Actions (botón "Run workflow")
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latido:
    name: Registrar el latido en la base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Llamar a registrar_latido()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          # Se quitan espacios o saltos de línea que pudieran haber quedado al pegar los secrets
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          URL="${URL%/}"
          CLAVE="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')"

          # Guardamos el código HTTP y la respuesta: si falla, se ve el MOTIVO que da Supabase
          # (la respuesta de Supabase nunca incluye las claves)
          codigo=$(curl --silent --show-error --max-time 30 -o respuesta.json -w "%{http_code}" -X POST \
            "$URL/rest/v1/rpc/registrar_latido" \
            -H "apikey: $CLAVE" \
            -H "Content-Type: application/json" \
            -d '{}')

          if [ "$codigo" -lt 200 ] || [ "$codigo" -ge 300 ]; then
            echo "::error::Supabase respondió HTTP $codigo"
            echo "Respuesta de Supabase:"
            cat respuesta.json
            echo
            # Pistas sobre el FORMATO de los secrets, sin mostrar su contenido
            case "$URL" in https://*.supabase.co) echo "URL: formato correcto" ;; *) echo "URL: el formato NO es https://<proyecto>.supabase.co" ;; esac
            case "$CLAVE" in
              sb_publishable_*) echo "Clave: es la publishable (correcta)" ;;
              sb_secret_*) echo "Clave: es la SECRET (no corresponde: usá la publishable)" ;;
              eyJ*) echo "Clave: es la anon vieja (JWT)" ;;
              *) echo "Clave: formato desconocido" ;;
            esac
            exit 1
          fi

          echo "Latido registrado: $(cat respuesta.json)"
